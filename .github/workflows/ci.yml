name: CI

# Lightweight only — packaging runs locally (see scripts/release-upload.mjs).
# Full OS pack matrix burned GitHub Actions minutes; do not re-enable pack jobs.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/

jobs:
  typecheck:
    name: Typecheck (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
