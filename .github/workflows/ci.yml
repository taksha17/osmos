name: CI

# Typecheck + unit tests on every PR, on all three target OSes.
# Packaging stays on each OS host (npm run pack:linux / pack:mac / pack:win,
# then npm run release:upload). Do not re-enable pack jobs — the full matrix
# burned GitHub Actions minutes.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/

jobs:
  typecheck:
    name: Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
